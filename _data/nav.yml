# Navigation for the foundation layout.
#
# `links` is every top-level destination, listed ONCE. `sections` are the
# areas of the site that show a context label next to the logo; the key
# matches a page's `nav_group` in its front matter.
#
# The template hides whichever link points at the current section's
# header_url, so "you are already here" is derived rather than maintained
# by hand. Adding a destination is one line in `links`; adding a section
# with its own label is one line in `sections`.
#
# A page with no `nav_group` gets the full link list and no context label.

links:
  - { title: Contact,   url: /contact/ }
  - { title: Blog,      url: /blog/ }
  - { title: Resources, url: /resources/ }
  - { title: About,     url: /about-site/ }
  - { title: Projects,  url: /projects/ }
  - { title: CV,        url: /cv/ }

sections:
  dictionary:    { header_text: Dictionary,    header_url: /dictionary/ }
  projects:      { header_text: Projects,      header_url: /projects/ }
  about:         { header_text: About,         header_url: /about-site/ }
  presentations: { header_text: Presentations, header_url: / }
