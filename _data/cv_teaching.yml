# Single source of truth for the Teaching section of /cv/.
#
# The course tables AND the summary counts on the CV are both rendered from
# this list, so they cannot drift apart. Add or change a course here once and
# every number on the page follows.
#
# Fields:
#   title       Course name as it should display
#   number      Catalog number(s). Slash form is used where a course was
#               renumbered and counts as a single distinct course.
#   level       graduate | undergraduate
#   year_start  First year taught
#   year_end    Most recent year taught; omit for a single-year course
#   sections    Class sections taught to date. LEAVE UNSET IF UNKNOWN --
#               the page omits the section total until every course has one.
#               Do not guess; an invented number defeats the purpose of
#               deriving the totals from this file.

